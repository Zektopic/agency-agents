name: Test scripts/lib.sh

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-lib:
    name: Run tests for lib.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test-lib.sh
        run: |
          chmod +x scripts/test-lib.sh
          ./scripts/test-lib.sh
